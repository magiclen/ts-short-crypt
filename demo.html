<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- <script src="https://cdn.jsdelivr.net/gh/magiclen/ts-short-crypt/dist/short-crypt.min.js"></script> -->
        <script src="./dist/short-crypt.min.js"></script>
        <title>ShortCrypt</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <style>
            .form-control:read-only {
                background-color: #eee;
            }
        </style>
    </head>

    <body class="p-3 p-lg-5">
        <div id="demo-short-crypt" class="container">
            <div class="row g-3">
                <div class="col-12">
                    <div class="form-floating mb-3">
                        <input
                            type="text"
                            id="key"
                            class="form-control"
                            placeholder="key"
                            value="magickey"
                        />
                        <label for="key">key</label>
                    </div>
                </div>
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">Encryption</div>
                        <div class="card-body">
                            <div class="row g-3 align-items-center">
                                <div class="col-12">
                                    <div class="form-floating mb-3">
                                        <input
                                            type="text"
                                            id="plaintext"
                                            class="form-control"
                                            placeholder="plaintext"
                                            value="hello"
                                        />
                                        <label for="plaintext">plaintext</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating mb-3">
                                        <input
                                            type="text"
                                            id="resultURLComponent"
                                            class="form-control"
                                            placeholder="resultURLComponent"
                                            readonly
                                        />
                                        <label for="resultURLComponent">resultURLComponent</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating mb-3">
                                        <input
                                            type="text"
                                            id="resultQRCodeAlphanumeric"
                                            class="form-control"
                                            placeholder="resultQRCodeAlphanumeric"
                                            readonly
                                        />
                                        <label for="resultQRCodeAlphanumeric"
                                            >resultQRCodeAlphanumeric</label
                                        >
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">Decryption</div>
                        <div class="card-body">
                            <div class="row g-3 align-items-center">
                                <div class="col-12">
                                    <div class="form-floating mb-3">
                                        <input
                                            type="text"
                                            id="cipher"
                                            class="form-control"
                                            placeholder="cipher"
                                            value="T_LVjlIC"
                                        />
                                        <label for="cipher"
                                            >cipher (URLComponent or QRCodeAlphanumeric)</label
                                        >
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating mb-3">
                                        <input
                                            type="text"
                                            id="resultPlainText"
                                            class="form-control"
                                            placeholder="resultPlainText"
                                            readonly
                                        />
                                        <label for="resultPlainText">resultPlainText</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            const inputKey = document.getElementById("key");

            const inputPlaintext = document.getElementById("plaintext");
            const inputResultURLComponent = document.getElementById("resultURLComponent");
            const inputResultQRCodeAlphanumeric = document.getElementById(
                "resultQRCodeAlphanumeric",
            );

            const inputCipher = document.getElementById("cipher");
            const inputResultPlainText = document.getElementById("resultPlainText");

            const encrypt = () => {
                const key = inputKey.value;

                const sc = new ShortCrypt.ShortCrypt(key);

                const plaintext = inputPlaintext.value;

                inputResultURLComponent.value = sc.encryptToURLComponent(plaintext);
                inputResultQRCodeAlphanumeric.value = sc.encryptToQRCodeAlphanumeric(plaintext);
            };

            const decrypt = () => {
                const key = inputKey.value;

                const sc = new ShortCrypt.ShortCrypt(key);

                const cipher = inputCipher.value;

                const plaintext =
                    sc.decryptURLComponentToString(cipher) ??
                    sc.decryptQRCodeAlphanumericToString(cipher);

                if (plaintext === undefined) {
                    inputResultPlainText.value = "";
                    inputResultPlainText.classList.add("is-invalid");
                    return;
                }

                inputResultPlainText.value = plaintext;
                inputResultPlainText.classList.remove("is-invalid");
            };

            inputKey.addEventListener("input", () => {
                encrypt();
                decrypt();
            });

            inputPlaintext.addEventListener("input", encrypt);
            inputCipher.addEventListener("input", decrypt);

            encrypt();
            decrypt();
        </script>
    </body>
</html>
