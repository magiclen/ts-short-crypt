name: CI

on: [push, pull_request]

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
            - uses: pnpm/action-setup@v6
              with:
                  version: latest
            - run: pnpm install
            - run: npm run check

    tests:
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest
                node-version:
                    - 24.x
                    - 26.x
        name: Use ${{ matrix.node-version }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: pnpm/action-setup@v6
              with:
                  version: latest
            - run: pnpm install
            - run: npm run build --if-present
            - run: npm test
